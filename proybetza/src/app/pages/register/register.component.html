<div class="auth-container animate-fade-in">
  <div class="auth-card">
    <h2 class="auth-title">Crear Cuenta</h2>
    <p class="auth-subtitle">Regístrate para personalizar tu experiencia, marcar ingredientes y dejar reseñas en el foro.</p>

    @if (error()) {
      <div class="auth-error-box">
        <p class="auth-error-text">{{ error() }}</p>
      </div>
    }

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label">Nombre de Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          class="form-control"
          placeholder="Tu apodo o nombre"
          required
        />
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          class="form-control"
          placeholder="ejemplo@correo.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          class="form-control"
          placeholder="Mínimo 8 caracteres, 1 número y 1 mayúscula"
          required
        />
      </div>

      <button type="submit" [disabled]="loading()" class="btn btn-primary auth-submit-btn">
        {{ loading() ? 'Creando cuenta...' : 'Registrarse' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes una cuenta? <a routerLink="/login" class="link-amber">Inicia sesión aquí</a></p>
    </div>
  </div>
</div>
