<div class="auth-layout w-full max-w-md mx-auto animate-fade-in px-4">
  <div class="card w-full bg-base-100 border border-base-200 shadow-xl p-6 md:p-8 rounded-3xl">
    <!-- Header -->
    <h2 class="text-2xl font-black text-base-content text-center mb-1">Iniciar Sesión</h2>
    <p class="text-xs text-base-content/60 text-center mb-6 leading-relaxed">
      Accede a tu cuenta para guardar tus preferencias y dejar reseñas.
    </p>

    <!-- Error Alert -->
    @if (error()) {
      <div class="alert alert-error shadow-sm rounded-2xl mb-4 text-xs font-bold leading-normal">
        <span>{{ error() }}</span>
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="form-control w-full">
        <label for="email" class="label py-1">
          <span class="label-text font-bold text-xs uppercase text-base-content/60">Correo Electrónico</span>
        </label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          class="input input-bordered focus:input-primary text-sm w-full"
          placeholder="ejemplo@correo.com"
          required
        />
      </div>

      <div class="form-control w-full">
        <label for="password" class="label py-1">
          <span class="label-text font-bold text-xs uppercase text-base-content/60">Contraseña</span>
        </label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          class="input input-bordered focus:input-primary text-sm w-full"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" [disabled]="loading()" class="btn btn-primary rounded-full w-full shadow-sm mt-2">
        @if (loading()) {
          <span class="loading loading-spinner loading-xs"></span>
          <span>Iniciando sesión...</span>
        } @else {
          <span>Ingresar</span>
        }
      </button>
    </form>

    <!-- Footer -->
    <div class="text-center text-xs text-base-content/60 mt-6">
      <p>¿No tienes cuenta? <a routerLink="/register" class="link link-primary font-bold">Regístrate aquí</a></p>
    </div>
  </div>
</div>
