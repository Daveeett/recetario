<div class="auth-container animate-fade-in">
  <div class="auth-card">
    <h2 class="auth-title">Iniciar Sesión</h2>
    <p class="auth-subtitle">Accede a tu cuenta para guardar tus preferencias y dejar reseñas.</p>

    @if (error()) {
      <div class="auth-error-box">
        <p class="auth-error-text">{{ error() }}</p>
      </div>
    }

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          class="form-control"
          placeholder="ejemplo@correo.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          class="form-control"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" [disabled]="loading()" class="btn btn-primary auth-submit-btn">
        {{ loading() ? 'Iniciando sesión...' : 'Ingresar' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>¿No tienes cuenta? <a routerLink="/register" class="link-amber">Regístrate aquí</a></p>
    </div>
  </div>
</div>
