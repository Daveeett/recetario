<a
  [routerLink]="['/recipe', recipe().id]"
  class="card card-compact bg-base-100 border border-base-200 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group shadow-sm overflow-hidden"
>
  <!-- Recipe Image -->
  <figure class="aspect-[4/3] w-full overflow-hidden bg-base-200">
    <img
      [src]="recipe().imageUrl"
      [alt]="recipe().title"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
      loading="lazy"
    />
  </figure>

  <!-- Recipe Details -->
  <div class="card-body gap-1.5 p-4">
    <div class="card-actions">
      <span class="badge badge-primary font-semibold text-xs py-2 px-2.5">{{ categoryLabel(recipe().category) }}</span>
    </div>
    <h2 class="card-title text-base font-bold text-base-content group-hover:text-primary transition-colors line-clamp-1 mt-1">
      {{ recipe().title }}
    </h2>
    <p class="text-sm text-base-content/60 line-clamp-2 leading-relaxed">{{ recipe().description }}</p>
    
    <div class="divider my-1 opacity-50"></div>
    
    <div class="flex items-center justify-between text-xs text-base-content/50 mt-1 font-semibold">
      <span class="flex items-center gap-1"> {{ recipe().cookTime }}</span>
      <span class="flex items-center gap-1"> {{ difficultyLabel(recipe().difficulty) }}</span>
    </div>
  </div>
</a>
