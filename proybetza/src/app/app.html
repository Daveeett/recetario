@if (isAuthRoute()) {
  <main class="auth-layout animate-fade-in">
    <router-outlet />
  </main>
} @else {
  <app-top-nav />
  <app-sidebar />
  @if (sidebarService.isOpen()) {
    <div class="sidebar-backdrop" (click)="sidebarService.close()"></div>
  }
  <main class="app-layout">
    <div class="app-container animate-fade-in">
      <router-outlet />
    </div>
  </main>
}
