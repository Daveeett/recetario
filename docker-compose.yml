version: '3.8'

services:
  frontend:
    build:
      context: ./proybetza
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./proybetza-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=proybetza
      - DB_USER=postgres
      - DB_PASSWORD=david181218
      - DB_SSL=false
      - JWT_SECRET=hasdsajdasjdkadkddkdas
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:4200
      - MAX_FILE_SIZE_MB=5
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: david181218
      POSTGRES_DB: proybetza
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
